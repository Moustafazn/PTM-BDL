# ── Mutation-Class Phospho Propagation (Step 06, Section 8d) ──────────────
# Biologically justified propagation of phospho features from measured cell
# lines to unmeasured cell lines sharing the same EGFR mutation class.
# This dramatically increases phospho coverage from ~16 to ~600+ samples.
# ─────────────────────────────────────────────────────────────────────────────
phospho_propagation:
  enabled: true
  attenuation_factor: 0.85   # Applied to log2FC values during propagation
  biological_references:
    - pmid: 18691549
      citation: "Yun et al., Cancer Cell 2008"
      finding: "L858R and exon19del stabilize αC-helix → equivalent autophosphorylation"
    - pmid: 17585332
      citation: "Sharma et al., Nat Rev Cancer 2007"
      finding: "Activating EGFR mutations produce convergent phospho-signaling"
    - pmid: 23940396
      citation: "Red Brewer et al., PNAS 2013"
      finding: "All activating mutations converge on same active conformation"
    - pmid: 15118125
      citation: "Sordella et al., Science 2004"
      finding: "exon19del and L858R both activate PI3K/AKT and STAT pathways"
    - pmid: 15713906
      citation: "Kobayashi et al., NEJM 2005"
      finding: "T790M preserves phosphorylation but blocks drug binding"
  internal_validation:
    - "Tozuka 2024: PC-9 and HCC827 (both exon19del) show concordant phospho (r>0.85)"
    - "PNAS 2025: H1975 vs HCC4006 show mutation-class-dependent phospho magnitudes"
  confidence_scores:
    # EGFR confidence scores
    measured: 1.00
    cross_drug_propagated: 0.90
    exon19del_propagated: 0.80
    L858R_propagated: 0.65
    L858R_T790M_propagated: 0.75
    wild_type_inferred: 0.40
    # HER2/ERBB2 confidence scores — added for ERBB family expansion
    HER2_amplified_measured: 1.00        # BT-474 direct measurements
    HER2_amplified_propagated: 0.70      # Propagated from BT-474 to other HER2-amp lines
    HER2_wild_type_inferred: 0.40        # HER2 WT prior (analogous to EGFR WT)

# ── PTM Modulators — Per-Cell-Line Biological Context (added 2026-06-28) ────
# Multiplicative modulators on the mutation-class PTM baseline vectors, driven
# by per-cell-line co-mutation status and tissue lineage.  Each magnitude is
# tied to a published mechanism (PMID).  This block fixes the failure mode
# documented in results/COMPREHENSIVE_EVALUATION_28_june.md §1.1 (randomized
# PTM control + mutation-group collapse), in which all ~951 samples share only
# ~5 unique PTM vectors because mapping was mutation-class only.
#
# CONVENTION:
#   multiplier  = 1.0 + Δ        (additive convention; e.g. +0.30 = ×1.30)
#   For HER2 amplification we use direct multipliers (high=1.5, etc.)
#
# Site naming:
#   EGFR sites use UniProt P00533 precursor numbering.  Classic literature
#   names (Y845/Y1068/Y1086/Y1173) map to (Y869/Y1092/Y1110/Y1197) precursor.
#   ERBB2 sites use UniProt P04626 numbering.
#
# CAVEAT (user-flagged 2026-06-28):
#   HER2-amp magnitudes (×1.0/×1.2/×1.5) are a first-pass.  Krug et al.
#   Cell 2020 (CPTAC breast cohort) shows ERBB2 phospho-peptide log2 intensity
#   scales near-linearly with copy number up to ~6 copies with mild saturation
#   above.  Citri & Yarden NRMCB 2006 (PMID 16829981) confirms phospho output
#   ∝ surface receptor stoichiometry up to maximal dimerization.  If the
#   randomized control still fails after this run, reduce to
#   ×1.0/×1.15/×1.30 (saturating gradient).
# ─────────────────────────────────────────────────────────────────────────────
ptm_modulators:
  enabled: true

  # ── EGFR baseline modulators (multiplicative deltas on baseline PTM vector) ──
  EGFR:
    # KRAS activating (G12/G13/Q61): constitutive RAS-MAPK → SHP2/PTPN11
    # dephosphatase suppression and SOS1 feedback. 1.3-1.5x pY1068 in
    # KRAS-mut LUAD by phospho-MS.
    # Sun et al., Sci Signal 2014 (PMID 24595108)
    # Coelho et al., Cell 2017 (PMID 28238573)
    kras_activating: 0.30          # applied to Y1092 (Y1068), Y1110 (Y1086)

    # MET amplification: MET-EGFR transactivation hyperphosphorylates
    # Y845 via SRC and Y1086 via GAB1; log2FC +1.5 at Y845 in HCC827-GR.
    # Engelman et al., Science 2007 (PMID 17463250)
    # Bean et al., PNAS 2007 (PMID 17804805)
    met_amp_Y869: 0.80             # Y845 in classic numbering
    met_amp_Y1110: 0.50            # Y1086 in classic numbering

    # PIK3CA activating (E542K, E545K, H1047R): PI3K-AKT feedback
    # reinforces SHC1 docking; 1.2-1.3x pY1173 in PIK3CA-mut.
    # Engelman, NRC 2009 (PMID 19629070)
    # Saal et al., Cancer Res 2007 (PMID 17575141)
    pik3ca_Y1197: 0.25             # Y1173 in classic numbering

    # TP53 LoF: impaired Cbl-mediated degradation (lower pY1045 occupancy)
    # + slower endocytic clearance (higher pY998 retention).
    # Sigismund et al., Physiol Rev 2018 (PMID 28954795)
    # Tomas et al., Trends Cell Biol 2014 (PMID 24210710)
    tp53_lof_Y998: 0.20
    tp53_lof_Y1069: -0.30          # Y1045 in classic numbering

    # PTEN loss: unopposed PI3K signaling sustains SHC-PI3K-AKT axis.
    # Carracedo & Pandolfi, Oncogene 2008 (PMID 18931626)
    pten_loss_Y1197: 0.30

    # ── Tissue-of-origin modulators (from CCLE OncotreeLineage) ────────
    # Lung (LUAD/LUSC) — reference (no modulation)
    # Breast — higher ERBB-family co-expression → heterodimer-driven
    #   phospho. Yarden & Sliwkowski, NRMCB 2001 (PMID 11252954)
    tissue_breast_Y1092_Y1197: 0.15
    # Skin/HNSCC squamous — higher baseline SRC activity.
    # Frame, J Cell Sci 2002 (PMID 12082147)
    tissue_squamous_Y869: 0.10

  # ── ERBB2/HER2 baseline modulators ────────────────────────────────────────
  ERBB2:
    # HER2 amplification → all tyrosine auto-phospho sites
    # Direct multipliers (not additive).  Magnitudes are FIRST-PASS — see
    # caveat above and Krug et al. Cell 2020 / CPTAC breast.
    # Hudis, NEJM 2007 (PMID 17626692)
    # Citri & Yarden, NRMCB 2006 (PMID 16829981)
    her2_amp_multiplier:
      baseline: 1.0
      intermediate: 1.2
      high: 1.5

    # PIK3CA activating → Y1248 (same mechanism as EGFR Y1173)
    # Engelman, NRC 2009 (PMID 19629070)
    pik3ca_Y1248: 0.25

    # PTEN loss → Y1248 (Carracedo 2008)
    pten_Y1248: 0.30

    # ER+ luminal subtype → Y1005 (Cbl site) decreases — higher receptor
    # stability in luminal subtype.
    # Arteaga & Engelman, Cancer Cell 2014 (PMID 24651011)
    er_plus_Y1005: -0.20

  # ── Curated HER2-amplification cell-line lists ────────────────────────────
  # CCLE OmicsCNGene.csv is not part of the manual download set.  These
  # tiers are curated from the Broad Cell Line Encyclopedia + literature.
  # "high": copy number >= 6 (clinical HER2-amplified equivalent)
  # "intermediate": copy number 3-5
  # all others → baseline.
  # References:
  #   Subik et al., Breast Cancer (Auckl) 2010 (PMID 20697531)
  #   Neve et al., Cancer Cell 2006 (PMID 17157791)
  her2_amp_tiers:
    high:
      - "BT-474"
      - "BT474"
      - "SK-BR-3"
      - "SKBR3"
      - "HCC1954"
      - "HCC2218"
      - "HCC2185"
      - "AU565"
      - "MDA-MB-453"
      - "MDAMB453"
      - "ZR-75-30"
      - "ZR7530"
      - "UACC-893"
      - "UACC893"
      - "EFM-192A"
      - "EFM192A"
      - "EFM-19"
      - "EFM19"
      - "HCC1419"
      - "HCC1569"
      - "JIMT-1"
      - "JIMT1"
      - "SUM-225"
      - "SUM225"
      - "KPL-4"
      - "KPL4"
      - "OCUB-1"
      - "OCUBM"
      - "UACC-732"
      - "UACC732"
    intermediate:
      - "HCC202"
      - "MDA-MB-361"
      - "MDAMB361"
      - "HCC1428"
      - "HCC1500"

  # ── Curated MET-amplified EGFR-context cell lines ─────────────────────────
  # Engelman et al. Science 2007 (PMID 17463250)
  # Bean et al., PNAS 2007 (PMID 17804805)
  met_amplified_lines:
    - "HCC827GR"
    - "HCC827-GR"
    - "EBC-1"
    - "EBC1"
    - "H1993"
    - "NCI-H1993"
    - "MKN45"
    - "MKN-45"
    - "SNU-5"
    - "SNU5"
    - "GTL-16"
    - "GTL16"


# ── Acquired Resistance Mutations (not in CCLE) ──────────────────────────────
# These mutations emerge DURING Osimertinib treatment in patients and are
# central to the project's thesis, but no established CCLE cell line carries
# them.  We define them here so step02 can generate the mutant sequences
# for ESM-2 embedding alongside the CCLE-derived mutations.
#
# Format: name → list of {pos, ref, alt} for point mutations,
#         or {start, end} for deletions, applied to UniProt P00533.
# ─────────────────────────────────────────────────────────────────────────────
acquired_resistance_mutations:
  - name: "C797S"
    description: "Cys797→Ser — blocks Osimertinib covalent binding"
    reference: "Thress et al., Nature Medicine 2015 (PMID: 26552849)"
    pdb_validation: "6LUD contains C797S in the triple mutant context"
    changes:
      - {type: point, pos: 797, ref: C, alt: S}

  - name: "L858R_T790M_C797S"
    description: "Triple mutant — full Osimertinib resistance"
    reference: "Thress et al., Nature Medicine 2015; PDB 6LUD (Cho et al., J Med Chem 2020)"
    pdb_validation: "6LUD — crystal structure of this exact triple mutant"
    changes:
      - {type: point, pos: 858, ref: L, alt: R}
      - {type: point, pos: 790, ref: T, alt: M}
      - {type: point, pos: 797, ref: C, alt: S}

  - name: "exon19del_E746_A750_T790M"
    description: "Exon 19 deletion (ELREA) + acquired T790M gatekeeper"
    reference: "Yu et al., Clin Cancer Res 2015 (PMID: 25870057)"
    pdb_validation: "Deletion verified at positions 746-750 in UniProt P00533"
    changes:
      - {type: deletion, start: 746, end: 750}
      - {type: point, pos: 790, ref: T, alt: M}

# ── Drug SMILES (Chemical Structures) ────────────────────────────────────────
# SMILES strings for ChemBERTa encoding. No download needed — hardcoded here.
# ─────────────────────────────────────────────────────────────────────────────
drugs:
  osimertinib:
    name: "Osimertinib"
    smiles: "C=CC(=O)Nc1cc(OC)c(Nc2nccc(-c3cn(C)c4ccccc34)n2)cc1N(C)CCN(C)C"
    generation: "3rd"
    binding_type: "covalent (C797)"
    notes: "Targets T790M; acrylamide warhead binds C797 covalently"
  gefitinib:
    name: "Gefitinib"
    smiles: "COc1cc2ncnc(Nc3ccc(F)c(Cl)c3)c2cc1OCCCN1CCOCC1"
    generation: "1st"
    binding_type: "reversible"
    notes: "First-generation reversible ATP-competitive EGFR TKI"
  afatinib:
    name: "Afatinib"
    smiles: "CN(C)C/C=C/C(=O)Nc1cc2c(Nc3ccc(F)c(Cl)c3)ncnc2cc1OC1CCOC1"
    generation: "2nd"
    binding_type: "covalent (C797)"
    notes: "Pan-ErbB irreversible inhibitor; targets C797 but less selective"
  erlotinib:
    name: "Erlotinib"
    smiles: "C(#Cc1cccc(c1)C)COc1cc2c(cc1OCCOC)ncnc2Nc1ccccc1"
    generation: "1st"
    binding_type: "reversible"
    notes: "First-generation reversible EGFR TKI"
  # ── HER2/pan-ERBB drugs — added for ERBB family expansion ──────────────
  lapatinib:
    name: "Lapatinib"
    smiles: "CS(=O)(=O)CCNCc1ccc(-c2ccc3ncnc(Nc4ccc(OCc5cccc(F)c5)c(Cl)c4)c3c2)o1"
    generation: "1st"
    binding_type: "reversible (dual EGFR/HER2)"
    target_proteins: ["EGFR", "ERBB2"]
    notes: "Dual EGFR/HER2 reversible TKI; approved for HER2+ breast cancer"
    reference: "PubChem CID 208908"
  sapitinib:
    name: "Sapitinib"
    smiles: "COc1cc2ncnc(Nc3ccc(F)c(Cl)c3)c2cc1NC(=O)/C=C/CN1CCOCC1"
    generation: "2nd"
    binding_type: "reversible (pan-ERBB)"
    target_proteins: ["EGFR", "ERBB2", "ERBB3"]
    notes: "Pan-ERBB reversible TKI (AZD8931); targets EGFR+ERBB2+ERBB3"
    reference: "PubChem CID 11476171; Hickinson et al., Clin Cancer Res 2010"
  # NOTE: Neratinib SMILES kept for reference but drug NOT in GDSC2 Oct 2023:
  # neratinib: "CCOc1cc2ncc(C#N)c(Nc3ccc(OCc4ccccn4)c(Cl)c3)c2cc1NC(=O)/C=C/CN(C)C"

# ── Model Architecture ───────────────────────────────────────────────────────
model:
  shared_dim: 512
  num_joint_attention_layers: 4
  num_attention_heads: 8
  dropout: 0.1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  batch_size: 16
  num_epochs: 100
  early_stopping_patience: 15
  esm2_model: "facebook/esm2_t33_650M_UR50D"
  chemberta_model: "DeepChem/ChemBERTa-77M-MTR"
  gearnet_hidden_dim: 512

# ── PTM-BDL Block Hyperparameters (proposal §7.4) ─────────────────────────────
# Per-sample 24-token (phospho ⊕ glyco) typed self-attention block.
# d_model, n_heads, n_layers are intentionally small — the BDL works on at
# most 24 tokens per sample, so it must NOT dominate the parameter budget
# of the static seq/struct/drug branch (which uses shared_dim=512).
# `use_typed_attention=false` is the architectural ablation arm consumed by
# step11b (`no_typed_attention`).
ptm_bdl:
  d_model: 64
  n_heads: 4
  n_layers: 2
  pool: "mask_aware_mean"
  use_typed_attention: true


# ── Training Settings ────────────────────────────────────────────────────────
training:
  seed: 42
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 4
  device: "cpu"  # "auto", "cuda", "mps", "cpu"
