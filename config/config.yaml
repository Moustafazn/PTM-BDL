# ============================================================================
# CONFIGURATION — PTM-Driven ERBB Family Drug Resistance Project
# ============================================================================
# Central configuration for all pipeline scripts.
# Edit paths and parameters here; every script reads from this file.
#
# CANCER FOCUS: EGFR-mutant NSCLC + HER2-positive
# breast cancer.  Pipeline steps filter data to both tissue types and the
# 6 ERBB-family TKI drugs listed below.
#
# ALL DATA IS MANUALLY DOWNLOADED — no auto-download in any script.
# Each script checks data/raw/<source>/ for files and prints instructions
# if anything is missing. Processed outputs go to data/processed/<source>/.
# ============================================================================

# ── Project Scope ─────────────────────────────────────────────────────────────
project:
  cancer_types:
    - "Non-Small Cell Lung Cancer (NSCLC)"
    - "Breast Cancer (HER2+)"
  # Gene-aware tissue filters: each target gene has its own tissue regex
  tissue_filters:
    EGFR:  "LUAD|LUSC|NSCLC|lung"                    # Lung cancer for EGFR
    ERBB2: "BRCA|breast|Breast Carcinoma"              # Breast cancer for HER2
  target_proteins:
    - "EGFR"
    - "ERBB2"
  target_drugs:
    - Gefitinib     # 1st-gen EGFR, reversible
    - Afatinib      # 2nd-gen pan-ERBB, irreversible (targets EGFR + HER2)
    - Erlotinib     # 1st-gen EGFR, reversible
    - Osimertinib   # 3rd-gen EGFR, targets T790M
    - Lapatinib     # 1st-gen EGFR/HER2 dual TKI, reversible
    - Sapitinib     # pan-ERBB (EGFR + ERBB2 + ERBB3), reversible
    # NOTE: Neratinib (ID 2097) is NOT in GDSC2 Oct 2023 release — removed

# ── Directory Layout ─────────────────────────────────────────────────────────
paths:
  raw_data:       "data/raw"          # manually downloaded files (input)
  processed_data: "data/processed"    # script-generated outputs
  features:       "data/features"     # ML embeddings (ESM-2, GearNet, ChemBERTa)
  models:         "data/models"       # trained model checkpoints
  results:        "results"           # evaluation reports
  figures:        "results/figures"   # plots and visualizations

# ── GDSC Drug Response Data ──────────────────────────────────────────────────
# Source: Sanger Cell Model Passports (formerly cancerrxgene.org)
# Download: https://cellmodelpassports.sanger.ac.uk/downloads
#   → "Drug Sensitivity Data" → "GDSC2 IC50 Data" → download GDSC2 dataset
#   → "Model Annotation" → "Model List" → download list of annotated models
# Place files in: data/raw/gdsc/
# ─────────────────────────────────────────────────────────────────────────────
gdsc:
  drug_ids:
    # EGFR-targeting TKIs (tested on NSCLC + breast cancer)
    Osimertinib: 1919    # 3rd-gen EGFR TKI, targets T790M (AZD9291)
    Gefitinib:   1010    # 1st-gen EGFR TKI, reversible
    Afatinib:    1032    # 2nd-gen pan-ERBB TKI, irreversible (EGFR + HER2)
    Erlotinib:   1168    # 1st-gen EGFR TKI, reversible
    # HER2/pan-ERBB TKIs — added for ERBB family expansion
    Lapatinib:   1558    # 1st-gen EGFR/HER2 dual TKI, reversible
    Sapitinib:   1549    # pan-ERBB (EGFR + ERBB2 + ERBB3), reversible
    # NOTE: Neratinib (ID 2097) is NOT in GDSC2 Oct 2023 release — removed
  # Drug-to-protein mapping: which target_protein(s) each drug is used in.
  # ALL drugs are tested on BOTH NSCLC (EGFR) and breast (ERBB2) cell lines
  # in GDSC2. This dual-context approach maximizes data and lets the model
  # learn cross-receptor drug response patterns.
  # GDSC2 diagnostic (Oct 2023): 52 breast cancer cell lines, ~160 NSCLC lines.
  drug_protein_mapping:
    Osimertinib: ["EGFR", "ERBB2"]   # NSCLC + breast (51 breast lines, 13 sens)
    Gefitinib:   ["EGFR", "ERBB2"]   # NSCLC + breast (51 breast lines, 1 sens)
    Afatinib:    ["EGFR", "ERBB2"]   # pan-ERBB: NSCLC + breast (50 breast lines, 9 sens)
    Erlotinib:   ["EGFR", "ERBB2"]   # NSCLC + breast (51 breast lines, 0 sens)
    Lapatinib:   ["ERBB2"]           # dual EGFR/HER2, breast only (51 lines, 6 sens)
    Sapitinib:   ["ERBB2"]           # pan-ERBB, breast only (targets EGFR+ERBB2+ERBB3)

# ── CCLE / DepMap Mutation Data ──────────────────────────────────────────────
# Source: DepMap (Broad Institute)
# Download: https://depmap.org/portal/data_page/?tab=allData
#   → Search "OmicsSomaticMutations" → download CSV (~300 MB)
#   → Search "Model" → download Model.csv
# Also download EGFR FASTA: https://www.uniprot.org/uniprot/P00533.fasta
# Place files in: data/raw/ccle/
# ─────────────────────────────────────────────────────────────────────────────
ccle:
  gene_symbols:
    - "EGFR"
    - "ERBB2"

# ── PDB Crystal Structures ──────────────────────────────────────────────────
# Source: RCSB Protein Data Bank (https://www.rcsb.org/)
# Download each PDB file and place in: data/raw/pdb/
#   curl -o <ID>.pdb https://files.rcsb.org/download/<ID>.pdb
# ─────────────────────────────────────────────────────────────────────────────
pdb:
  # ── STRUCTURE ASSIGNMENT PHILOSOPHY ─────────────────────────────────────
  # Structures are assigned MUTATION-DRIVEN, not drug-driven.
  # Each EGFR mutation class maps to ONE representative structure regardless
  # of which drug the sample is paired with.  This prevents the structural
  # branch (GearNet) from leaking drug identity and instead captures
  # mutation-induced conformational changes.
  #
  # Drug binding information is separately captured by ChemBERTa (step09)
  # and the PTM-structure integration (step10).
  #
  # Mapping (in step06 map_mutations_to_pdb):
  #   Wild-type (inactive)       → 2GS6  (WT apo)
  #   L858R (active)             → 2JIT  (L858R mutant)
  #   Exon 19 del (active)       → 4HJO  (del(E746-A750) mutant)
  #   L858R/T790M (double)       → 5EDP  (double mutant apo)
  #   T790M (gatekeeper)         → 3IKA  (T790M + WZ4002)
  #   L858R/T790M/C797S (triple) → 6LUD  (triple + Osimertinib)
  # ────────────────────────────────────────────────────────────────────────
  structures:
    # ── Mutation-driven structures (used in step06 mapping) ──────────────
    - id: "2GS6"
      description: "Wild-type EGFR kinase domain (apo, inactive conformation)"
      mutations: []
      drug: null
      mapping_role: "WT / passenger / VUS"
    - id: "2JIT"
      description: "EGFR L858R mutant kinase domain (active conformation, 2.47Å)"
      mutations: ["L858R"]
      drug: null
      mapping_role: "L858R / other activating point mutations"
      reference: "Stamos et al., JBC 2002 (PMID 12183436)"
    - id: "4HJO"
      description: "EGFR exon 19 deletion (del E746-A750) kinase domain (active conformation, 1.8Å)"
      mutations: ["E746_A750del"]
      drug: null
      mapping_role: "Exon 19 deletions / exon 19 region variants"
      reference: "Yasuda et al., Sci Transl Med 2013 (PMID 23550210)"
    - id: "5EDP"
      description: "EGFR L858R/T790M double mutant (apo, 2.9Å)"
      mutations: ["L858R", "T790M"]
      drug: null
      mapping_role: "L858R/T790M double mutant"
    - id: "3IKA"
      description: "EGFR T790M mutant + WZ4002 (3rd-gen covalent inhibitor)"
      mutations: ["T790M"]
      drug: "WZ4002"
      mapping_role: "T790M gatekeeper (without L858R)"
    - id: "6LUD"
      description: "EGFR L858R/T790M/C797S + Osimertinib (triple mutant, full resistance)"
      mutations: ["L858R", "T790M", "C797S"]
      drug: "osimertinib"
      mapping_role: "C797S / triple mutant resistance"
    # ── Legacy drug-bound WT structures (kept for reference, not used in mapping) ──
    - id: "2ITY"
      description: "Wild-type EGFR + Gefitinib (1st-gen TKI) — reference only"
      mutations: []
      drug: "gefitinib"
      mapping_role: "reference_only"
    - id: "4ZAU"
      description: "Wild-type EGFR + Osimertinib/AZD9291 (3rd-gen TKI) — reference only"
      mutations: []
      drug: "osimertinib"
      mapping_role: "reference_only"
    - id: "4G5J"
      description: "EGFR + Afatinib (2nd-gen irreversible TKI) — reference only"
      mutations: []
      drug: "afatinib"
      mapping_role: "reference_only"
    # ── HER2 (ERBB2) structures — added for ERBB family expansion ───────
    - id: "3PP0"
      description: "HER2 kinase domain (apo, active conformation, 2.25Å)"
      target_protein: "ERBB2"
      mutations: []
      drug: null
      mapping_role: "HER2 WT / HER2-amplified"
      reference: "Aertgeerts et al., JBC 2011 (PMID 21393237)"
    - id: "3RCD"
      description: "HER2 kinase domain + Lapatinib (DFG-out inactive, 2.40Å)"
      target_protein: "ERBB2"
      mutations: []
      drug: "lapatinib"
      mapping_role: "reference_only"
      reference: "Aertgeerts et al., JBC 2011 (PMID 21393237)"

# ── Reference Sequences ─────────────────────────────────────────────────────
# EGFR: UniProt P00533  — Download: https://www.uniprot.org/uniprot/P00533.fasta
# HER2: UniProt P04626  — Download: https://www.uniprot.org/uniprot/P04626.fasta
# Place in: data/raw/ccle/
# ─────────────────────────────────────────────────────────────────────────────
uniprot:
  EGFR:
    accession: "P00533"
    kinase_domain_start: 712
    kinase_domain_end: 979
    fasta_file: "egfr_P00533.fasta"
    signal_peptide_length: 24   # residues 1-24
  ERBB2:
    accession: "P04626"
    kinase_domain_start: 720
    kinase_domain_end: 987
    fasta_file: "erbb2_P04626.fasta"
    signal_peptide_length: 22   # residues 1-22

# ── PTM Data (Step 04) ───────────────────────────────────────────────────────
# Source: UniProt P00533 — curated PTM annotations (23 phosphosites)
#   Download JSON:
#     curl -o data/raw/ptm/uniprot_P00533.json \
#          "https://rest.uniprot.org/uniprotkb/P00533.json"
#   Place in: data/raw/ptm/uniprot_P00533.json
#
# IMPORTANT — Numbering convention:
#   All positions use UniProt P00533 PRECURSOR numbering (includes 24-aa
#   signal peptide).  This matches the mutation nomenclature (T790M, L858R,
#   C797S) and the kinase domain boundaries (712–979).
#   Classic literature sites (Y845, Y1068, Y1173) use mature-protein
#   numbering and are +24 in UniProt precursor coordinates (Y869, Y1092, Y1197).
# ─────────────────────────────────────────────────────────────────────────────
ptm:
  # ── PTM-BDL DIMENSIONALITY (PTM_Biological_Dynamics_Layer.md §3, §7) ──
  # Phospho dim = 12 sites per gene (HER2 has 10 real + 2 zero-padded).
  # Glyco  dim = 12 sites per gene (EGFR has 12 real; HER2 has 7 real + 5
  #             zero-padded). Both share the same dim so the PTM-BDL self-
  #             attention block sees a uniform (phospho ⊕ glyco) = 24-token
  #             sequence per sample regardless of which gene the sample is
  #             paired with.
  # Modification-type embedding IDs used by step10 (PTM-BDL):
  #     phospho_Y = 0   phospho_S = 1   phospho_T = 2   glyco_N = 3
  ptm_dim:   12
  glyco_dim: 12
  # ── EGFR phosphorylation sites (UniProt P00533 precursor numbering) ────
  EGFR:
    signal_peptide_length: 24
    phospho_sites:
      - {position: 869,  residue: "Y869",  amino_acid: "Y", classic_name: "Y845",  function: "SRC family kinase substrate"}
      - {position: 991,  residue: "S991",  amino_acid: "S", classic_name: "S991",  function: "regulatory"}
      - {position: 998,  residue: "Y998",  amino_acid: "Y", classic_name: "Y998",  function: "regulatory"}
      - {position: 1016, residue: "Y1016", amino_acid: "Y", classic_name: "Y992",  function: "PLCγ binding"}
      - {position: 1039, residue: "S1039", amino_acid: "S", classic_name: "S1039", function: "regulatory (Ser)"}
      - {position: 1041, residue: "T1041", amino_acid: "T", classic_name: "T1041", function: "regulatory (Thr)"}
      - {position: 1069, residue: "Y1069", amino_acid: "Y", classic_name: "Y1045", function: "c-Cbl → receptor degradation"}
      - {position: 1092, residue: "Y1092", amino_acid: "Y", classic_name: "Y1068", function: "GRB2 → RAS-MAPK (primary)"}
      - {position: 1110, residue: "Y1110", amino_acid: "Y", classic_name: "Y1086", function: "GRB2 → PI3K (secondary)"}
      - {position: 1125, residue: "Y1125", amino_acid: "Y", classic_name: "Y1101", function: "SHP1 phosphatase"}
      - {position: 1172, residue: "Y1172", amino_acid: "Y", classic_name: "Y1148", function: "SHC/DOK"}
      - {position: 1197, residue: "Y1197", amino_acid: "Y", classic_name: "Y1173", function: "SHC1 → PI3K-AKT (survival)"}
    # ── EGFR N-glycosylation sites (UniProt P00533 precursor numbering) ──
    # 12 canonical extracellular N-glyco sites used by the PTM-BDL glyco
    # token branch (proposal §3.1).  Positions are UniProt precursor (signal
    # peptide 1–24 included).  All 12 are observed at non-zero coverage in
    # the unified drugptm output:
    #   sources J/K (MCP 2025/b) cover N128, N175, N196, N352, N361, N413,
    #                            N444, N528, N568, N603, N623
    #   source  L (Taniguchi 2024 sEGFR/CHO) covers N56, N128, N175, N196,
    #                            N352, N361, N413, N444, N528, N568, N603,
    #                            N623
    #   source  N (Sethi 2020 OSCC reference) covers N56, N128, N175, N352,
    #                            N361, N413, N444, N603
    # Functional annotations are from Zhu 2026 (PMID review), Liu 2017
    # EGFR-glyco structural review, and the ErbB2 atlas (Taniguchi 2024).
    glyco_sites:
      - {position:  56, residue: "N56",  amino_acid: "N", classic_name: "N32",  function: "extracellular domain I (ligand-binding)"}
      - {position: 128, residue: "N128", amino_acid: "N", classic_name: "N104", function: "extracellular domain II (dimerization arm)"}
      - {position: 175, residue: "N175", amino_acid: "N", classic_name: "N151", function: "extracellular domain II (dimerization arm)"}
      - {position: 196, residue: "N196", amino_acid: "N", classic_name: "N172", function: "extracellular domain II"}
      - {position: 352, residue: "N352", amino_acid: "N", classic_name: "N328", function: "extracellular domain III (ligand-binding)"}
      - {position: 361, residue: "N361", amino_acid: "N", classic_name: "N337", function: "extracellular domain III — critical for ligand affinity (Zhu 2026)"}
      - {position: 413, residue: "N413", amino_acid: "N", classic_name: "N389", function: "extracellular domain III"}
      - {position: 444, residue: "N444", amino_acid: "N", classic_name: "N420", function: "extracellular domain III/IV junction"}
      - {position: 528, residue: "N528", amino_acid: "N", classic_name: "N504", function: "extracellular domain IV — homolog of HER2 N530"}
      - {position: 568, residue: "N568", amino_acid: "N", classic_name: "N544", function: "extracellular domain IV (membrane-proximal)"}
      - {position: 603, residue: "N603", amino_acid: "N", classic_name: "N579", function: "extracellular domain IV (membrane-proximal)"}
      - {position: 623, residue: "N623", amino_acid: "N", classic_name: "N599", function: "extracellular domain IV (membrane-proximal)"}
  # ── HER2/ERBB2 phosphorylation sites (UniProt P04626 numbering) ────────
  # 10 sites + 2 zero-padded to match ptm_dim=12
  # Homologous sites: Y1221≡Y1068(EGFR), Y1248≡Y1173(EGFR)
  ERBB2:
    signal_peptide_length: 22
    phospho_sites:
      - {position: 686,  residue: "T686",  amino_acid: "T", classic_name: "T686",  function: "regulatory (Thr, juxtamembrane)", egfr_homolog: "T693"}
      - {position: 1005, residue: "Y1005", amino_acid: "Y", classic_name: "Y1005", function: "c-Cbl direct binding → degradation", egfr_homolog: null}
      - {position: 1054, residue: "S1054", amino_acid: "S", classic_name: "S1054", function: "regulatory (Ser)", egfr_homolog: "S1039"}
      - {position: 1099, residue: "T1099", amino_acid: "T", classic_name: "T1099", function: "regulatory (Thr)", egfr_homolog: null}
      - {position: 1139, residue: "Y1139", amino_acid: "Y", classic_name: "Y1139", function: "adaptor recruitment", egfr_homolog: "Y1069"}
      - {position: 1151, residue: "S1151", amino_acid: "S", classic_name: "S1151", function: "regulatory", egfr_homolog: null}
      - {position: 1196, residue: "Y1196", amino_acid: "Y", classic_name: "Y1196", function: "c-Cbl → receptor downregulation", egfr_homolog: "Y1110"}
      - {position: 1221, residue: "Y1221", amino_acid: "Y", classic_name: "Y1221", function: "GRB2 → RAS-MAPK (primary)", egfr_homolog: "Y1092"}
      - {position: 1222, residue: "Y1222", amino_acid: "Y", classic_name: "Y1222", function: "GRB2/SHC dual docking (unique to HER2)", egfr_homolog: null}
      - {position: 1248, residue: "Y1248", amino_acid: "Y", classic_name: "Y1248", function: "SHC1 → PI3K-AKT (survival)", egfr_homolog: "Y1197"}
      # Sites 11-12: zero-padded (no biological site) to match ptm_dim=12
    # ── HER2/ERBB2 N-glycosylation sites (UniProt P04626 numbering) ──────
    # 7 canonical N-glyco sites (Taniguchi 2024 atlas: PMID 38109791).
    # Padded to glyco_dim = 12 with 5 zero slots so the glyco token tensor
    # has the same shape across both genes (proposal §3.2, §7.4).
    # Homologous sites:  N530 (ERBB2) ↔ N528 (EGFR) — extracellular domain
    # IV.  These provide the cross-receptor glyco anchor used by step12 /
    # step13 to validate that the PTM-BDL learns FUNCTION, not protein
    # identity (proposal §3.3 cross-receptor table).
    glyco_sites:
      - {position:  68, residue: "N68",  amino_acid: "N", classic_name: "N46",  function: "extracellular domain I", egfr_homolog: null}
      - {position: 124, residue: "N124", amino_acid: "N", classic_name: "N102", function: "extracellular domain II (dimerization arm)", egfr_homolog: null}
      - {position: 187, residue: "N187", amino_acid: "N", classic_name: "N165", function: "extracellular domain II", egfr_homolog: null}
      - {position: 259, residue: "N259", amino_acid: "N", classic_name: "N237", function: "extracellular domain II/III junction", egfr_homolog: null}
      - {position: 530, residue: "N530", amino_acid: "N", classic_name: "N508", function: "extracellular domain IV — trastuzumab binding / homolog of EGFR N528", egfr_homolog: "N528"}
      - {position: 571, residue: "N571", amino_acid: "N", classic_name: "N549", function: "extracellular domain IV (membrane-proximal)", egfr_homolog: null}
      - {position: 629, residue: "N629", amino_acid: "N", classic_name: "N607", function: "extracellular domain IV (membrane-proximal)", egfr_homolog: null}
      # Sites 8-12: zero-padded (no biological site) to match glyco_dim=12

