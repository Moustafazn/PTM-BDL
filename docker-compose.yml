# ============================================================================
# docker-compose.yml — PTM-BDL Tool
# ============================================================================
# Reproducible execution for reviewers. Supports all 3 case studies.
#
# Usage:
#   docker compose up                     — Run ALL case studies
#   docker compose up egfr                — EGFR/ERBB2 TKI case study only
#   docker compose up hela                — HeLa/HDAC inhibitor case study only
#   docker compose up k562                — K562/CML BCR-ABL case study only
#   docker compose run shell              — Interactive shell
#
# Per-phase (any case study):
#   docker compose run --rm pipeline make data CASE=hela
#   docker compose run --rm pipeline make train CASE=k562
#
# GPU support:
#   docker compose --profile gpu up
# ============================================================================

services:

  # ── Full Pipeline (all case studies) ────────────────────────────────────────
  pipeline:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-pipeline
    command: make all
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1

  # ── Individual Case Studies ─────────────────────────────────────────────────
  egfr:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-egfr
    command: make egfr
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ egfr ]

  hela:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-hela
    command: make hela
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ hela ]

  k562:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-k562
    command: make k562
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ k562 ]

  # ── Individual Phases ───────────────────────────────────────────────────────

  data:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-data
    command: make data
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ data ]

  train:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-train
    command: make train
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ train ]

  evaluate:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-evaluate
    command: make evaluate
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ evaluate ]

  benchmark:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-benchmark
    command: make benchmark
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ benchmark ]

  figures:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-figures
    command: make figures
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ figures ]

  test:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-test
    command: make test
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ test ]

  # ── Interactive Shell ───────────────────────────────────────────────────────
  shell:
    build: .
    image: ptm-bdl:latest
    container_name: ptm-bdl-shell
    stdin_open: true
    tty: true
    command: bash
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    profiles: [ shell ]

  # ── GPU Pipeline (NVIDIA) ───────────────────────────────────────────────────
  pipeline-gpu:
    build:
      context: .
      args:
        BASE_IMAGE: pytorch/pytorch:2.4.1-cuda12.4-cudnn9-runtime
    image: ptm-bdl-gpu:latest
    container_name: ptm-bdl-gpu
    command: make all
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles: [ gpu ]
